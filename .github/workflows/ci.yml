name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: lo-agent

      - name: Checkout dependency lo-client-sdk
        uses: actions/checkout@v5
        with:
          repository: ouuabb/lo-client-sdk
          path: lo-client-sdk

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        working-directory: lo-agent
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: lo-agent
        run: yarn test

      - name: Run lint
        working-directory: lo-agent
        run: yarn run lint

      - name: Build renderer
        working-directory: lo-agent
        run: yarn run build